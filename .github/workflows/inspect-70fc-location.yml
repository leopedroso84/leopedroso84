name: inspect-70fc-location
on:
  push:
    branches: [tmp-shortcut-audit-20260824]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-shortcut-audit-20260824
      - name: Inspect exact region
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,plistlib,pathlib,pprint
          IDS={'BASE':'70fc71200eee41bab952cc233c5bd57d','CURRENT':'e3969d6c0f164083b41cd2f6f8129368'}
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 shortcut-inspect'})
              with urllib.request.urlopen(req,timeout=40) as r:return r.read()
          out=[]
          for label,sid in IDS.items():
              rec=json.loads(get(f'https://www.icloud.com/shortcuts/api/records/{sid}'))
              dl=rec['fields']['shortcut']['value']['downloadURL'].replace('${f}','shortcut.plist')
              obj=plistlib.loads(get(dl)); A=obj['WFWorkflowActions']
              out.append(f'=== {label} ===')
              for i in range(116,129):
                  a=A[i]; ident=a.get('WFWorkflowActionIdentifier','?'); p=a.get('WFWorkflowActionParameters',{})
                  out.append(f'INDEX {i} IDENT {ident}')
                  out.append(pprint.pformat(p,width=150,sort_dicts=True))
          pathlib.Path('audit-e396').mkdir(exist_ok=True)
          pathlib.Path('audit-e396/exact-region.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-e396/exact-region.txt
          git commit -m "inspect exact e396 region" || exit 0
          git push origin HEAD:tmp-shortcut-audit-20260824
