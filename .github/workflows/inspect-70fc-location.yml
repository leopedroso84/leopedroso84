name: inspect-70fc-location
on:
  push:
    branches: [tmp-shortcut-audit-20260824]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-shortcut-audit-20260824
      - name: Inspect lunch insertion region
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,plistlib,pathlib,pprint
          sid='1021889dd92844f38c35131a70b70bbb'
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 shortcut-inspect'})
              with urllib.request.urlopen(req,timeout=40) as r:return r.read()
          rec=json.loads(get(f'https://www.icloud.com/shortcuts/api/records/{sid}'))
          dl=rec['fields']['shortcut']['value']['downloadURL'].replace('${f}','shortcut.plist')
          A=plistlib.loads(get(dl))['WFWorkflowActions']
          out=[]
          for i in range(139,156):
              a=A[i]; ident=a.get('WFWorkflowActionIdentifier','?'); p=a.get('WFWorkflowActionParameters',{})
              out.append(f'INDEX {i} IDENT {ident}')
              out.append(pprint.pformat(p,width=160,sort_dicts=True))
          pathlib.Path('audit-102188').mkdir(exist_ok=True)
          pathlib.Path('audit-102188/lunch-region.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-102188/lunch-region.txt
          git commit -m "inspect lunch insertion region" || exit 0
          git push origin HEAD:tmp-shortcut-audit-20260824
