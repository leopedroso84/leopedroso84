name: shortcut-audit-70fc

on:
  push:
    branches:
      - tmp-shortcut-audit-20260824

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-shortcut-audit-20260824

      - name: Compare approved 70fc with current e396
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-e396 && mkdir audit-e396
          python3 - <<'PY'
          import urllib.request, json, plistlib, pathlib, difflib
          OUT=pathlib.Path('audit-e396')
          IDS={'approved':'70fc71200eee41bab952cc233c5bd57d','current':'e3969d6c0f164083b41cd2f6f8129368'}
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 shortcut-audit'})
              with urllib.request.urlopen(req,timeout=40) as r:return r.read()
          objs={}
          for n,sid in IDS.items():
              rec=json.loads(get(f'https://www.icloud.com/shortcuts/api/records/{sid}'))
              dl=rec['fields']['shortcut']['value']['downloadURL'].replace('${f}','shortcut.plist')
              objs[n]=plistlib.loads(get(dl))
          B=objs['approved']['WFWorkflowActions']; C=objs['current']['WFWorkflowActions']
          def ident(a): return a.get('WFWorkflowActionIdentifier','?')
          def p(a): return a.get('WFWorkflowActionParameters',{})
          def norm(x):
              if isinstance(x,dict): return {k:norm(v) for k,v in x.items() if k not in {'UUID','GroupingIdentifier','OutputUUID'}}
              if isinstance(x,list): return [norm(v) for v in x]
              if isinstance(x,bytes): return x.hex()
              return x
          def sig(a): return ident(a)+'|'+json.dumps(norm(p(a)),sort_keys=True,ensure_ascii=False,default=str)
          def input_desc(q):
              x=q.get('WFInput',{})
              try:
                  v=x.get('Variable',{}).get('Value',{})
                  return v.get('VariableName') or v.get('OutputName') or 'output'
              except: return ''
          def short(a):
              q=p(a); i=ident(a); gid=q.get('GroupingIdentifier','')
              gs=gid[-6:] if gid else '-'
              if i=='is.workflow.actions.conditional':
                  return f"COND m={q.get('WFControlFlowMode')} c={q.get('WFCondition')} n={q.get('WFNumberValue')} in={input_desc(q)} gid={gs}"
              if i=='is.workflow.actions.setvariable': return f"SETVAR {q.get('WFVariableName')} gid={gs}"
              if i=='is.workflow.actions.number': return f"NUMBER {q.get('WFNumberActionNumber')} gid={gs}"
              if i=='is.workflow.actions.calculate': return f"CALCULATE {q.get('WFMathOperation')} gid={gs}"
              if i=='is.workflow.actions.dnd.set':
                  fm=q.get('FocusModes') or {}; return f"FOCUS {fm.get('DisplayString')} enabled={q.get('Enabled')} gid={gs}"
              return f"{i} gid={gs}"
          sm=difflib.SequenceMatcher(a=[sig(x) for x in B],b=[sig(x) for x in C],autojunk=False)
          ops=[x for x in sm.get_opcodes() if x[0]!='equal']
          lines=[f'BASE_COUNT={len(B)} CURRENT_COUNT={len(C)}',f'OPCODES={ops}']
          lines.append('\nBASE_REGION_108_137:')
          for i in range(108,138): lines.append(f' B{i}: {short(B[i])}')
          lines.append('\nCURRENT_REGION_108_137:')
          for i in range(108,138): lines.append(f' C{i}: {short(C[i])}')
          (OUT/'region.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-e396
          git commit -m "audit e396 region" || exit 0
          git push origin HEAD:tmp-shortcut-audit-20260824
