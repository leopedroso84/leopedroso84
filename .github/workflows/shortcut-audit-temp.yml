name: Shortcut Audit Temp

on:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Audit iCloud Shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, plistlib, hashlib, re
          from pathlib import Path

          shortcut_id = 'a18e4bc4795342be8bde2e969cc48002'
          api = f'https://www.icloud.com/shortcuts/api/records/{shortcut_id}'
          req = urllib.request.Request(api, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              meta = json.load(r)

          urls=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k=='downloadURL' and isinstance(v,str): urls.append(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(meta)
          if not urls: raise SystemExit('No downloadURL found')

          req=urllib.request.Request(urls[0],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
          print('SHORTCUT_ID',shortcut_id)
          print('BYTES',len(raw))
          print('SHA256',hashlib.sha256(raw).hexdigest())
          print('HEADER',raw[:8])

          obj=plistlib.loads(raw)
          print('TOP_KEYS',sorted(obj.keys()) if isinstance(obj,dict) else type(obj).__name__)
          actions=obj.get('WFWorkflowActions',[]) if isinstance(obj,dict) else []
          print('ACTION_COUNT',len(actions))
          for k in ['WFWorkflowClientVersion','WFWorkflowClientRelease','WFWorkflowMinimumClientVersion','WFWorkflowMinimumClientVersionString','WFWorkflowTypes','WFWorkflowInputContentItemClasses']:
              if isinstance(obj,dict) and k in obj: print(k,repr(obj[k]))

          print('=== ACTIONS BEGIN ===')
          for i,a in enumerate(actions,1):
              ident=a.get('WFWorkflowActionIdentifier','') if isinstance(a,dict) else ''
              params=a.get('WFWorkflowActionParameters',{}) if isinstance(a,dict) else {}
              print(f'[{i:02d}] {ident}')
              print(json.dumps(params,ensure_ascii=False,sort_keys=True,default=str))
          print('=== ACTIONS END ===')

          needles=['http://','https://','url','webhook','ssh','script','runshortcut','clipboard','message','mail','cellular','mobiledata','wifi','wi-fi','battery','bateria','lowpower','pouca energia','30','29']
          hits=[]
          def strings(x,path='root'):
              if isinstance(x,dict):
                  for k,v in x.items(): strings(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for j,v in enumerate(x): strings(v,path+f'[{j}]')
              elif isinstance(x,str):
                  low=x.lower()
                  if any(n in low for n in needles): hits.append((path,x))
          strings(obj)
          print('=== IMPORTANT STRING HITS ===')
          for p,v in hits: print(p,'=>',v)
          print('=== END ===')
          PY
